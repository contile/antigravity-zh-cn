name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and test
        run: |
          npm run validate-dict
          npm test

      - name: Package release archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_DIR="antigravity-zh-cn-${TAG}"
          mkdir -p "${PKG_DIR}"
          cp -r bin src locales scripts package.json README.md LICENSE CONTRIBUTING.md "一键安装中文汉化.bat" "一键还原官方英文.bat" "${PKG_DIR}/"
          chmod +x "${PKG_DIR}/bin/cli.js" "${PKG_DIR}/scripts/install.sh" "${PKG_DIR}/scripts/restore.sh"
          zip -r "${PKG_DIR}.zip" "${PKG_DIR}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: antigravity-zh-cn-*.zip
